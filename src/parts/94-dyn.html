<style>
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;font-family:var(--ui)}
.panel h3{margin-top:0}
.btn{font-family:var(--ui);font-size:.9rem;border:1px solid var(--arakku);background:var(--arakku);color:var(--surface);border-radius:999px;padding:6px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--arakku)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kd{font-family:var(--body);font-size:1.15rem;line-height:1.8;margin:6px 0}
.kd small{display:block;font-family:var(--ui);font-size:.8rem;color:var(--muted)}
/* eras */
.eras{overflow-x:auto;margin:14px 0}
.eras .strip{display:flex;min-width:640px;gap:2px}
.eras button{border:0;cursor:pointer;color:#fff;font-size:.74rem;line-height:1.3;padding:8px 4px;min-height:58px;border-radius:6px}
.eras .ax{display:flex;min-width:640px;justify-content:space-between;font-family:var(--ui);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
/* tinai */
.tinai{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tinai button{border:2px solid transparent;border-radius:10px;padding:0;background:none;cursor:pointer;overflow:hidden;color:var(--ink);font-size:.76rem}
.tinai button[aria-pressed="true"]{border-color:var(--arakku)}
.tinai svg{display:block;width:100%;height:auto}
.tinai span{display:block;padding:2px 0 4px}
.tbig svg{width:100%;height:auto;border-radius:10px;display:block;margin:10px 0}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.9rem;line-height:1.6}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
/* leaf */
.leaf svg{width:100%;height:auto;display:block}
.leaf ol{columns:2;font-size:.86rem;line-height:1.7;padding-left:22px;margin:8px 0 0}
/* kolam lab */
.klab canvas{width:min(300px,100%);aspect-ratio:1;background:var(--ground);border-radius:14px;display:block;margin:10px auto}
/* pallanguzhi */
.pb{background:#6b3f22;border-radius:40px;padding:12px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.pb button{aspect-ratio:1;border-radius:50%;border:0;background:#3d2313;color:#f6e7c8;font-family:var(--ui);font-size:1rem;font-weight:600;cursor:pointer;box-shadow:inset 0 3px 6px rgba(0,0,0,.5);padding:0}
.pb button.mine{outline:2px solid #e7b23c}
.pb button.hot{background:#e7b23c;color:#27131a}
.pb button:disabled{cursor:default}
.score{display:flex;justify-content:space-between;font-size:.9rem}
.score b.on{color:var(--arakku);text-decoration:underline}
/* quiz, tutor, media, path */
.opts{display:grid;gap:8px;margin:10px 0}
.opts button{font-family:var(--ui);font-size:.95rem;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.opts button.ok{border-color:#2e7d4f;background:#2e7d4f;color:#fff}
.opts button.no{border-color:#b3261e;background:#b3261e;color:#fff}
#tq{flex:1;min-width:0;padding:10px 14px;font:inherit;font-family:var(--ui);border:1.5px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}
#tans{white-space:pre-wrap;font-family:var(--body);line-height:1.85;margin-top:10px}
.sugg button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:.82rem;cursor:pointer}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.media div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--ui)}
.media b{display:block;font-size:.95rem;margin-bottom:6px}
.media a{display:inline-block;font-size:.8rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 11px;margin-right:6px}
.done{margin-left:10px;vertical-align:middle;font-size:.78rem;padding:3px 12px}
.meter{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:var(--manjal);width:0;transition:width .3s}

/* ---- kolam generator (shared) ---- */
function kolam(c,N,animate){
  const g=c.getContext("2d"),R=[];for(let i=1;i<=N;i+=2)R.push(i);for(let i=N-2;i>=1;i-=2)R.push(i);
  const m=(N-1)/2,dots=[],set=new Set();
  R.forEach((w,y)=>{for(let k=0;k<w;k++){const x=m-(w-1)/2+k;dots.push([x,y]);set.add(x+","+y);}});
  dots.sort((a,b)=>(Math.abs(a[0]-m)+Math.abs(a[1]-m))-(Math.abs(b[0]-m)+Math.abs(b[1]-m)));
  const d=devicePixelRatio||1,w=c.clientWidth||280;c.width=c.height=w*d;g.setTransform(d,0,0,d,0,0);
  const s=w/(N+1.2),o=(w-(N-1)*s)/2;let t0=null;const id=(c._k=(c._k||0)+1);
  function loop(x,y){const X=o+x*s,Y=o+y*s,h=s/2,q=s/4,r=s*.21;
    const V=[[X,Y-h,set.has(x+","+(y-1))],[X+h,Y,set.has((x+1)+","+y)],[X,Y+h,set.has(x+","+(y+1))],[X-h,Y,set.has((x-1)+","+y)]];
    const M=[[X+q,Y-q],[X+q,Y+q],[X-q,Y+q],[X-q,Y-q]];
    g.beginPath();g.moveTo(X-q,Y-q);
    V.forEach((v,i)=>{if(v[2]){g.lineTo(v[0],v[1]);g.lineTo(M[i][0],M[i][1]);}else g.arcTo(v[0],v[1],M[i][0],M[i][1],r);});g.closePath();}
  function frame(ts){if(c._k!==id)return;if(t0===null)t0=ts;const T=(!animate||reduce)?1:Math.min(1,(ts-t0)/(250*N+600));
    g.clearRect(0,0,w,w);g.lineCap=g.lineJoin="round";g.strokeStyle="#fbf6ee";g.lineWidth=Math.max(1.5,s*.075);
    const per=4*s*.72,f=T*dots.length;
    dots.forEach((p,i)=>{const k=Math.max(0,Math.min(1,f-i));if(k<=0)return;loop(p[0],p[1]);g.setLineDash(k<1?[per*k,per*2]:[]);g.stroke();});
    g.setLineDash([]);g.fillStyle="#e7b23c";dots.forEach(p=>{g.beginPath();g.arc(o+p[0]*s,o+p[1]*s,Math.max(1.5,s*.06),0,7);g.fill();});
    if(T<1)requestAnimationFrame(frame);}
  requestAnimationFrame(frame);return dots.length;
}

/* ---- games: playable pallanguzhi (simplified) ---- */
(function(){
  const LA=t("நீங்கள் (கீழ் வரிசை): ","You (bottom row): "),LB=t("எதிராளி (மேல் வரிசை): ","Opponent (top row): ");
  const box=el(`<div class="panel"><h3>${t("பல்லாங்குழி ஆடிப் பாருங்கள்","Play pallanguzhi")}</h3><div class="score"><b id="pA">${LA}0</b><b id="pB">${LB}0</b></div><div class="pb" id="pb"></div><div id="pmsg" style="font-size:.9rem;min-height:1.6em"></div><div class="row"><button type="button" class="btn ghost" id="prs">${t("புதிய ஆட்டம்","New game")}</button></div><div style="font-size:.78rem;color:var(--muted);margin-top:8px">${t("எளிய வடிவம்: இருவர் ஒரே திரையில் மாறி மாறி ஆடலாம். ஒவ்வொரு குழியிலும் 6 காய். பசு, தக்கம் விதிகள் இதில் இல்லை.","Simplified: two players take turns on one screen. Six counters per pit. The pasu and closed-pit rules are left out.")}</div></div>`);
  const anchor=[...$("v-games").querySelectorAll("p")].find(x=>x.textContent.startsWith(t("எண்ணுதல், கணக்கிடுதல்","It trains a child")));(anchor||$("v-games").lastChild).after(box);
  let P,S,turn,run;const order=[13,12,11,10,9,8,7,0,1,2,3,4,5,6];
  const own=i=>i<7?0:1,wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
  function paint(hot){$("pb").innerHTML=order.map(i=>`<button type="button" data-i="${i}" class="${own(i)===turn&&!run?"mine":""} ${i===hot?"hot":""}" ${run||own(i)!==turn||!P[i]?"disabled":""} aria-label="${t("குழி, காய்கள்:","Pit, counters:")} ${P[i]}">${P[i]}</button>`).join("");
    $("pA").textContent=LA+S[0];$("pB").textContent=LB+S[1];$("pA").className=turn===0?"on":"";$("pB").className=turn===1?"on":"";}
  function reset(){P=Array(14).fill(6);S=[0,0];turn=0;run=false;$("pmsg").textContent=t("கீழ் வரிசையில் ஒரு குழியைத் தொடுங்கள்.","Tap a pit in the bottom row.");paint();}
  async function play(i){run=true;let hand=P[i];P[i]=0;let pos=i,steps=0;
    while(steps++<400){
      while(hand>0){pos=(pos+1)%14;P[pos]++;hand--;paint(pos);await wait(170);}
      const nx=(pos+1)%14;
      if(P[nx]>0){hand=P[nx];P[nx]=0;pos=nx;paint(pos);await wait(260);continue;}
      const cap=(nx+1)%14;const got=P[cap];S[turn]+=got;P[cap]=0;
      $("pmsg").textContent=got?(A.en?`${turn?"Top row wins":"Bottom row wins"} the ${got} counters beyond the empty pit.`:`வெறுங்குழிக்கு அடுத்த குழியின் ${got} காய்கள் ${turn?"எதிராளிக்கு":"உங்களுக்கு"}.`):t("வெறுங்குழி; காய் கிடைக்கவில்லை.","Empty pit; nothing won.");break;}
    turn=1-turn;run=false;
    const mine=k=>P.slice(k*7,k*7+7).reduce((a,b)=>a+b,0);
    if(!mine(turn)){S[1-turn]+=mine(1-turn);P.fill(0);paint();$("pmsg").textContent=S[0]===S[1]?t("ஆட்டம் சமம்.","A draw."):(S[0]>S[1]?t("கீழ் வரிசை வென்றது!","Bottom row wins!"):t("மேல் வரிசை வென்றது!","Top row wins!"))+t(" புதிய ஆட்டம் தொடங்கலாம்."," Start a new game.");return;}
    $("pmsg").textContent+=t(" இப்போது "+(turn?"மேல்":"கீழ்")+" வரிசையின் முறை."," Now the "+(turn?"top":"bottom")+" row plays.");paint();}
  box.querySelector("#pb").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||run||b.disabled)return;play(+b.dataset.i);});
  box.querySelector("#prs").onclick=()=>{if(!run)reset();};reset();
})();

(function(){
  const v=$("v-path"),hs=[...v.querySelectorAll("h2")].filter(h=>h.textContent.startsWith(t("நிலை","Stage")));let done=LS.get("tk-path",[]);const BT=[];
  const m=el(`<div class="panel"><b id="pthl"></b><div class="meter"><i id="pthm"></i></div><div style="font-size:.78rem;color:var(--muted)">${t("முடித்த நிலைகளைக் குறித்து வையுங்கள். இக்குறிப்பு இந்தக் கருவியில் மட்டும் சேமிக்கப்படும்.","Mark the stages you have finished. This is saved on this device only.")}</div></div>`);hs[0].before(m);
  const upd=()=>{$("pthl").textContent=A.en?`${done.length} of ${hs.length} stages done`:`${hs.length} நிலைகளில் ${done.length} முடிந்தன`;$("pthm").style.width=(done.length/hs.length*100)+"%";
    hs.forEach((h,i)=>{const b=BT[i];b.textContent=done.includes(i)?t("✓ முடித்தேன்","✓ Done"):t("முடித்ததாகக் குறி","Mark as done");b.className="btn done"+(done.includes(i)?"":" ghost");});};
  hs.forEach((h,i)=>{const b=document.createElement("button");b.type="button";b.style.margin="0 0 8px";h.after(b);BT.push(b);b.onclick=()=>{done=done.includes(i)?done.filter(x=>x!==i):done.concat(i);LS.set("tk-path",done);upd();};});upd();
})();

/* ---- every chapter: photo and video links ---- */
(function(){
  const M={};$("mediadata").textContent.split("\n").map(s=>s.trim()).filter(Boolean).forEach(l=>{const p=l.split("|");(M[p[0]]=M[p[0]]||[]).push(p);});
  Object.keys(M).forEach(k=>{const v=$("v-"+k);if(!v)return;const d=document.createElement("div");
    d.innerHTML=`<h2>${t("படங்களும் காணொளிகளும்","Photos and videos")}</h2><p style="font-family:var(--ui);font-size:.86rem;color:var(--muted)">${t("இணைப்புகள் விக்கிமீடியா பொதுவகத்தின் படத் தேடலையும் யூடியூப் தேடலையும் புதிய பக்கத்தில் திறக்கும். அங்கே காண்பவை இந்தக் களஞ்சியத்தால் சரிபார்க்கப்பட்டவை அல்ல.","These links open a Wikimedia Commons image search and a YouTube search in a new tab. What you find there has not been checked by this treasury.")}</p><div class="media">${M[k].map(p=>`<div><b>${esc(A.en?p[2]:p[1])}</b><a href="https://commons.wikimedia.org/w/index.php?title=Special:MediaSearch&type=image&search=${encodeURIComponent(p[2])}" target="_blank" rel="noopener">${t("படங்கள்","Photos")}</a><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(A.en?p[2]:p[1])}" target="_blank" rel="noopener">${t("காணொளிகள்","Videos")}</a></div>`).join("")}</div>`;
    v.appendChild(d);});
})();
};
</script>
